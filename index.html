<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aura Player</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar card">
        <h1>Aura Music</h1>
        <p class="subtitle">YouTube Music-inspired player</p>
        <form id="song-form" class="song-form">
          <h2>Add your song</h2>
          <label>
            Track title
            <input id="title" required placeholder="Night Drive" />
          </label>
          <label>
            Artist
            <input id="artist" required placeholder="Unknown Artist" />
          </label>
          <label>
            Select audio file
            <input id="song-file" type="file" accept="audio/*" required />
          </label>
          <button type="submit" class="accent-btn">Add to library</button>
          <p class="field-hint">
            Songs are saved in an IndexedDB database so your library stays after refresh.
          </p>
        </form>
      </aside>

      <main class="player-area">
        <section class="now-playing card">
          <div class="header-row">
            <div>
              <p class="label">Now Playing</p>
              <h2 id="now-title">Choose a song</h2>
              <p id="now-artist">Your local library</p>
            </div>
            <button id="mute-btn" class="icon-btn" aria-label="Mute or unmute">🔊</button>
          </div>

          <div class="visualizer" aria-hidden="true">
            <span></span><span></span><span></span><span></span><span></span>
          </div>

          <div class="timeline-wrap">
            <span id="current-time">0:00</span>
            <input id="progress" type="range" min="0" max="100" value="0" />
            <span id="total-time">0:00</span>
          </div>

          <div class="controls">
            <button id="shuffle-btn" class="icon-btn" aria-label="Toggle shuffle">🔀</button>
            <button id="prev-btn" class="icon-btn" aria-label="Previous track">⏮</button>
            <button id="play-btn" class="play-btn" aria-label="Play or pause">
              <span id="play-icon">▶</span>
              <span class="pulse-ring"></span>
            </button>
            <button id="next-btn" class="icon-btn" aria-label="Next track">⏭</button>
            <button id="repeat-btn" class="icon-btn" aria-label="Toggle repeat">🔁</button>
          </div>

          <div class="volume-wrap">
            <label for="volume">Volume</label>
            <input id="volume" type="range" min="0" max="1" step="0.01" value="0.8" />
          </div>
        </section>

        <section class="library card">
          <div class="header-row">
            <h2>Library</h2>
            <p id="track-count">0 tracks</p>
          </div>
          <ul id="track-list" class="track-list"></ul>
        </section>
      </main>
    </div>

    <div id="toast" class="toast"></div>
    <audio id="audio"></audio>

    <script src="script.js"></script>
  </body>
</html>
